version: 0.3
# 运行配置（多模型角色可切；密钥走环境变量 .env）
models:                                   # 多模型角色配置（provider 可切）
  generate: { base_url: "http://127.0.0.1:8000/v1", model: "your-model-name", temperature: 0 }  # 任意 OpenAI 兼容端点（示例占位）；实际运行时以 .env 的 LLM_* 为准
  judge:    { base_url: "https://api.deepseek.com", model: "deepseek-flash", api_key_env: "JUDGE_API_KEY" }  # 异构（DeepSeek-V4.1-Flash，用户成本口径）；未配置时退化为 generate
  embed:    { backend: remote, model: "qwen3-embedding-4b", base_url: "" }   # backend: mock | bge | remote（remote＝自部署 Qwen3-Embedding-4B；端点走 .env 的 EMBED_BASE_URL；回退改回 bge 一行切换；对照裁决见 eval/report_embed_compare.md）
retrieval:  { schema_top_tables: 3, schema_top_fields: 20, fewshot_top_k: 3 }
retry:      { max_retries: 2 }
clarify:    { max_rounds: 1 }
